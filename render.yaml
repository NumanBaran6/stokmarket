# Render.com blueprint — backend API servisi
# Render panelinde "New +" > "Blueprint" ile bu dosyadan otomatik kurulum yapılabilir.
services:
  - type: web
    name: numangida-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Aşağıdakiler panelden elle girilecek (gizli):
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        sync: false
